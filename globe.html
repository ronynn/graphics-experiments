<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Globe — Vanta-compatible API</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  #bg{position:fixed;top:0;left:0;right:0;bottom:0}
  #bg canvas{width:100%;height:100%;display:block}
  #hud{position:fixed;left:10px;bottom:10px;font:11px monospace;color:#fff;opacity:.6;
       pointer-events:none;text-shadow:0 1px 2px #000}
</style>
</head>
<body>
<div id="bg"></div>
<div id="hud">starting…</div>

<!-- 1. Load the standalone globe library (No Three.js required) -->
<script src="globe.js"></script>

<!-- 2. Vanta-compatible Configuration -->
<script>
  // Initialize the effect just like you would with standard Vanta.js
  var globe = VANTA.GLOBE({
    el: '#bg',
    mouseControls: true,
    touchControls: true,
    gyroControls: true,
    minHeight: 200.00,
    minWidth: 200.00,
    scale: 1.00,
    scaleMobile: 1.00,
    color: 0xff8c5a,
    color2: 0xffffff,
    backgroundColor: 0x0e3d3d
  });
  
  // Example of how to dynamically update options later in your app:
  // globe.setOptions({ color: 0x00ff00, backgroundColor: 0x000000 });
</script>
</body>
</html>
